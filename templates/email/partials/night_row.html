<!-- One row per night. Repeat for each night and join into {{nights_block}}. Placeholders: {{date}}, {{venue}}, {{headliner}} -->
<tr><td class="bg-card" bgcolor="#0d0d0d" style="padding:8px 20px;background-color:#0d0d0d;background-image:linear-gradient(#0d0d0d,#0d0d0d);">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:1px solid #262214;">
    <tr>
      <td class="stack" width="34%" valign="middle" style="padding:10px 10px 12px 0;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:13px;line-height:18px;letter-spacing:1px;text-transform:uppercase;color:#D4AF37;font-weight:700;">{{date}}</td>
      <td class="stack" valign="middle" style="padding:10px 0 12px 0;font-family:'Inter',Helvetica,Arial,sans-serif;">
        <span style="display:block;font-family:'Playfair Display',Georgia,serif;font-size:20px;line-height:26px;color:#FFFFFF;font-weight:700;">{{venue}}</span>
        <span style="display:block;font-size:14px;line-height:20px;color:#A8A8A8;">{{headliner}}</span>
      </td>
    </tr>
  </table>
</td></tr>
