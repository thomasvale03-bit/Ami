<!-- One row per night. Repeat for each night and join into {{nights_block}}. Placeholders: {{date}}, {{venue}}, {{headliner}} -->
<tr><td style="padding:12px 0 0 0;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FBF8EF" style="background-color:#FBF8EF;border:1px solid #EADFBF;border-left:6px solid #D4AF37;border-radius:0 10px 10px 0;">
    <tr>
      <td class="stack date" width="40%" valign="middle" style="padding:18px 12px 18px 20px;font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:26px;line-height:30px;color:#111111;font-weight:800;">{{date}}</td>
      <td class="stack" valign="middle" style="padding:18px 20px 18px 8px;font-family:'Inter',Helvetica,Arial,sans-serif;">
        <span style="display:block;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:19px;line-height:24px;color:#111111;font-weight:800;">{{venue}}</span>
        <span style="display:block;margin-top:3px;font-size:14px;line-height:20px;color:#555555;font-weight:600;">{{headliner}}</span>
      </td>
    </tr>
  </table>
</td></tr>
