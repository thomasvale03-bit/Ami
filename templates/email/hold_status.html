<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{TITLE}}</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
  table,td{mso-table-lspace:0pt;mso-table-rspace:0pt;}
  img{-ms-interpolation-mode:bicubic;border:0;outline:none;text-decoration:none;}
  body{margin:0 !important;padding:0 !important;width:100% !important;background-color:#050505;}
  a[x-apple-data-detectors]{color:inherit !important;text-decoration:none !important;}
  @media screen and (max-width:620px){
    .container{width:100% !important;max-width:100% !important;}
    .px{padding-left:22px !important;padding-right:22px !important;}
    .h1{font-size:30px !important;line-height:36px !important;}
    .logo{width:230px !important;height:auto !important;}
    .btn a{display:block !important;}
    .stack{display:block !important;width:100% !important;}
  }
  :root{color-scheme:light only;supported-color-schemes:light only;}
  .bg-page{background-color:#050505 !important;}
  .bg-card{background-color:#0d0d0d !important;}
  [data-ogsc] .bg-page,[data-ogsb] .bg-page{background-color:#050505 !important;}
  [data-ogsc] .bg-card,[data-ogsb] .bg-card{background-color:#0d0d0d !important;}
  [data-ogsc] body,[data-ogsb] body{background-color:#050505 !important;}
</style>
</head>
<body class="bg-page" bgcolor="#050505" style="margin:0;padding:0;background-color:#050505;background-image:linear-gradient(#050505,#050505);">
<!-- Preheader (hidden preview text) -->
<div style="display:none;font-size:1px;color:#050505;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{PREHEADER}}&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#050505" class="bg-page" style="background-color:#050505;background-image:linear-gradient(#050505,#050505);">
<tr><td align="center" bgcolor="#050505" class="bg-page" style="padding:24px 10px;background-color:#050505;background-image:linear-gradient(#050505,#050505);">

  <!--[if mso]><table role="presentation" width="600" bgcolor="#0d0d0d" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
  <table role="presentation" class="container bg-card" bgcolor="#0d0d0d" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#0d0d0d;background-image:linear-gradient(#0d0d0d,#0d0d0d);border:1px solid #2b2414;border-radius:14px;">

    <!-- Top gold bar -->
    <tr><td height="4" bgcolor="#D4AF37" style="height:4px;line-height:4px;font-size:0;background-color:#D4AF37;background-image:linear-gradient(90deg,#AA6C08,#F7DD72,#D4AF37,#AA6C08);border-radius:14px 14px 0 0;">&nbsp;</td></tr>

    <!-- Logo -->
{{LOGO}}

    <!-- Hero / body -->
    <tr><td align="center" class="px" style="padding:22px 40px 6px 40px;">
      <p style="margin:0 0 10px 0;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;letter-spacing:4px;text-transform:uppercase;color:#D4AF37;font-weight:700;">{{EYEBROW}}</p>
      <h1 class="h1" style="margin:0;font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:34px;line-height:40px;color:#F5F5F5;font-weight:700;">{{HEADLINE}}</h1>
    </td></tr>

    <tr><td bgcolor="#0d0d0d" class="px bg-card" style="background-color:#0d0d0d;background-image:linear-gradient(#0d0d0d,#0d0d0d);padding:8px 40px 10px 40px;text-align:left;">
{{BODY}}
    </td></tr>

    <!-- Sign-off -->
    <tr><td align="center" class="px" style="padding:34px 40px 34px 40px;">
      <p style="margin:8px 0 0 0;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#F5F5F5;font-weight:600;">{{SIGNOFF}}</p>
    </td></tr>

    <!-- Footer -->
    <tr><td bgcolor="#0d0d0d" class="px bg-card" style="background-color:#0d0d0d;background-image:linear-gradient(#0d0d0d,#0d0d0d);padding:22px 40px 28px 40px;border-top:1px solid #241f12;font-family:'Inter',Helvetica,Arial,sans-serif;font-size:12px;line-height:19px;color:#8a8a8a;text-align:center;">
      {{FOOTER}}<br>
      <span style="color:#5f5f5f;">Must be 21+ with valid ID. Entry not guaranteed; all admission at venue discretion.</span>
    </td></tr>

  </table>
  <!--[if mso]></td></tr></table><![endif]-->

</td></tr>
</table>
</body>
</html>
